name: CI/CD

# `verify` tourne sur chaque push et chaque pull request. `build` et `deploy`
# ne se déclenchent qu'après son succès, et seulement sur `main`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/opaline-admin
  NEXT_PUBLIC_API_URL: https://api.opaline.tadjo.dev/api

jobs:
  verify:
    name: Vérifier
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      # Sans `--fix` : la CI vérifie, elle ne corrige pas à la place de
      # l'auteur du commit.
      - name: Lint
        run: npx eslint .

      - name: Build
        run: npm run build

  build:
    name: Construire et publier l'image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déployer sur le VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Tirer l'image et redémarrer
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

      # nginx-proxy-manager route déjà `admin.opaline.tadjo.dev` vers le
      # conteneur `opaline-admin` ; on vérifie ici depuis l'extérieur que le
      # nouveau conteneur a bien démarré et répond.
      - name: Vérifier que le back-office répond
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ secrets.ADMIN_DOMAIN }}/api/health")
            if [ "$code" = "200" ]; then
              echo "Back-office sain (${code})"
              exit 0
            fi
            echo "Tentative $i : ${code:-échec}, nouvelle tentative dans 5 s"
            sleep 5
          done
          echo "::error::Le back-office ne répond pas après déploiement"
          exit 1
