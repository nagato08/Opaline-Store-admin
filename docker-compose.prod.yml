# Déploiement du back-office sur le VPS.
#
# Pas de base de données ni de cache ici — c'est un client de l'API. Comme
# `back_ecommerce`, aucun port n'est publié : nginx-proxy-manager (déjà en
# place sur le VPS, partagé avec les autres projets) route par nom de
# conteneur sur le réseau externe `web`.
#
# Deux variables sont obligatoires à l'exécution, dans un `.env` à côté de ce
# fichier (jamais versionné) :
#
#   SESSION_SECRET=…   32 caractères minimum — signe le cookie de session.
#                      `openssl rand -hex 32`
#   API_URL=…          adresse interne de l'API sur le réseau Docker.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

name: opaline-admin

services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/nagato08/opaline-admin:latest}
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.opaline.tadjo.dev/api}
    container_name: opaline-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Le cookie de session est signé avec ce secret : le changer déconnecte
      # tout le monde, l'omettre empêche le back-office de démarrer.
      SESSION_SECRET: ${SESSION_SECRET:?requis}
      # Les appels serveur passent par le réseau Docker et ne sortent pas de
      # la machine. `NEXT_PUBLIC_API_URL`, figé au build, reste l'adresse
      # publique utilisée par le navigateur.
      API_URL: ${API_URL:-http://opaline-api:3000/api}
    networks: [web]

networks:
  # Créé une fois pour tout le VPS, pas par ce fichier (voir back_ecommerce/DEPLOIEMENT.md).
  web:
    external: true
